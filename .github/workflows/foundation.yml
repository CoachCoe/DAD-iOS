name: Mobile foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contract:
    runs-on: [self-hosted, dad, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node scripts/check-foundation.mjs
      - run: node --test scripts/check-foundation.test.mjs
  ios:
    runs-on: [self-hosted, dad, macos]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: bash scripts/check-ios.sh
