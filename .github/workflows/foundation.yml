name: Mobile foundation checks
# Push runs only on the integration branches; a PR branch is checked once, by its pull_request run.
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: [self-hosted, dad, macOS]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node scripts/check-foundation.mjs
      - run: node --test scripts/check-foundation.test.mjs
      - name: Foundation drift (advisory)
        run: node scripts/check-foundation-drift.mjs
      - run: node --test scripts/check-foundation-drift.test.mjs
  secret-scan:
    runs-on: [self-hosted, dad, macOS]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # Pinned gitleaks binary (version + sha256) rather than a floating action tag, matching the
      # repo's self-hosted, no-surprises posture. --redact keeps any match out of the logs.
      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.0
          case "$(uname -s)" in
            Linux) os=linux ;;
            Darwin) os=darwin ;;
            *) echo "unsupported os: $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=x64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          case "${os}_${arch}" in
            linux_x64) sha=79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e ;;
            linux_arm64) sha=b4cbbb6ddf7d1b2a603088cd03a4e3f7ce48ee7fd449b51f7de6ee2906f5fa2f ;;
            darwin_x64) sha=ca221d012d247080c2f6f61f4b7a83bffa2453806b0c195c795bbe9a8c775ed5 ;;
            darwin_arm64) sha=b251ab2bcd4cd8ba9e56ff37698c033ebf38582b477d21ebd86586d927cf87e7 ;;
          esac
          tarball="gitleaks_${GITLEAKS_VERSION}_${os}_${arch}.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${sha}  ${tarball}" | shasum -a 256 -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version
      - name: Scan full git history for secrets
        run: ./gitleaks detect --source . --redact --no-banner --config .gitleaks.toml
  ios:
    runs-on: [self-hosted, dad, macOS]
    timeout-minutes: 25
    # One iOS job at a time shares the CI build caches.
    concurrency:
      group: dad-ios-macos
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      # The self-hosted Mac is also a development machine: the job keeps its own build caches (apart
      # from the /tmp/dad-ios-* defaults a local run uses) and tests on a simulator it creates, so a
      # local run can neither feed it stale build products nor kill its app mid-test.
      - name: Create this job's simulator
        run: echo "DAD_SIMULATOR_ID=$(node scripts/simulator.mjs --create "DAD CI $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")" >> "$GITHUB_ENV"
      - run: bash scripts/check-ios.sh
        env:
          DAD_SWIFT_BUILD: /tmp/dad-ci-ios-swift
          DAD_XCODE_BUILD: /tmp/dad-ci-ios-xcode
      - name: Delete this job's simulator
        if: always() && env.DAD_SIMULATOR_ID != ''
        run: xcrun simctl delete "$DAD_SIMULATOR_ID"
