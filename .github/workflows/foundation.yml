name: Mobile foundation checks
# Push runs only on the integration branches; a PR branch is checked once, by its pull_request run.
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node scripts/check-foundation.mjs
      - run: node --test scripts/check-foundation.test.mjs
      - name: Foundation drift (advisory)
        run: node scripts/check-foundation-drift.mjs
      - run: node --test scripts/check-foundation-drift.test.mjs
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # Pinned gitleaks binary (version + sha256) rather than a floating action tag, matching the
      # repo's no-surprises posture. --redact keeps any match out of the logs.
      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.0
          case "$(uname -s)" in
            Linux) os=linux ;;
            Darwin) os=darwin ;;
            *) echo "unsupported os: $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=x64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          case "${os}_${arch}" in
            linux_x64) sha=79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e ;;
            linux_arm64) sha=b4cbbb6ddf7d1b2a603088cd03a4e3f7ce48ee7fd449b51f7de6ee2906f5fa2f ;;
            darwin_x64) sha=ca221d012d247080c2f6f61f4b7a83bffa2453806b0c195c795bbe9a8c775ed5 ;;
            darwin_arm64) sha=b251ab2bcd4cd8ba9e56ff37698c033ebf38582b477d21ebd86586d927cf87e7 ;;
          esac
          tarball="gitleaks_${GITLEAKS_VERSION}_${os}_${arch}.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${sha}  ${tarball}" | shasum -a 256 -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version
      - name: Scan full git history for secrets
        run: ./gitleaks detect --source . --redact --no-banner --config .gitleaks.toml
  ios:
    # `xcode-27` is GitHub's hosted macOS image carrying Xcode 27 and the iOS 27 simulator runtime
    # (the README toolchain floor); macos-latest/macos-26 stop at Xcode 26.
    runs-on: xcode-27
    # Hosted macOS runs cold: no warm build caches, simulator boot and a full xcodebuild test.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      # Pinned rather than scripts/simulator.mjs's "first iPhone on the newest runtime": on this image
      # that is iOS 27.1's only iPhone, the iPhone Duo, whose TabView exposes no tab bar to UI tests.
      - name: Create this job's simulator
        run: |
          udid=$(xcrun simctl create "DAD CI $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "iPhone 18 Pro" com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "DAD_SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
      # A cold hosted simulator otherwise times out handing the UI test runner its background assertion.
      - name: Boot this job's simulator
        run: xcrun simctl bootstatus "$DAD_SIMULATOR_ID" -b
      - run: bash scripts/check-ios.sh
        env:
          DAD_SWIFT_BUILD: /tmp/dad-ci-ios-swift
          DAD_XCODE_BUILD: /tmp/dad-ci-ios-xcode
      - name: Delete this job's simulator
        if: always() && env.DAD_SIMULATOR_ID != ''
        run: xcrun simctl delete "$DAD_SIMULATOR_ID"
